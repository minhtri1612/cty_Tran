<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hoàng Nhật SCM · Quản trị kho</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div id="authRoot"></div>
    <div class="shell" id="shell" style="display: none">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="logo">H</div>
          <div><b>HOÀNG NHẬT</b><small>SUPPLY CHAIN MANAGEMENT</small></div>
        </div>
        <div id="nav"></div>
        <div class="sidebar-bottom">
          Công ty Hoàng Nhật · Quản lý kho nội bộ<br /><span
            style="display: inline-block; margin-top: 7px"
            >● Hệ thống hoạt động</span
          >
        </div>
      </aside>
      <div class="main-area">
        <header class="topbar">
          <button class="icon-button mobile-toggle" onclick="toggleNav()">
            ☰
          </button>
          <div class="top-label">
            Quản lý kho &amp; thu mua<b>Công ty Hoàng Nhật</b>
          </div>
          <div class="top-spacer"></div>
          <label class="search-top"
            ><span>⌕</span
            ><input
              id="globalSearch"
              placeholder="Tìm mã NVL, tên vật tư..." /></label
          ><button
            class="icon-button"
            onclick="go('materials')"
            title="Mở danh mục và kiểm tra tồn kho"
          >
            ♧
          </button>
          <div class="profile-wrap">
            <button
              class="profile"
              id="profileButton"
              onclick="toggleProfileMenu(event)"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <span class="avatar" id="profileAvatar">AD</span
              ><span class="who"
                ><b id="profileName">Quản trị viên</b
                ><small id="profileRole">Admin</small></span
              ><span aria-hidden="true">⌄</span>
            </button>
            <div class="profile-menu" id="profileMenu" role="menu" hidden>
              <div class="profile-card">
                <span class="avatar profile-menu-avatar" id="menuAvatar"
                  >AD</span
                >
                <div>
                  <b id="menuName">Quản trị viên</b
                  ><small id="menuLogin">admin</small
                  ><span class="profile-role-pill" id="menuRole"
                    >Quản trị viên</span
                  >
                </div>
              </div>
              <button
                role="menuitem"
                onclick="closeProfileMenu();passwordModal()"
              >
                ⚿ Đổi mật khẩu</button
              ><button
                class="profile-logout"
                role="menuitem"
                onclick="logout()"
              >
                ⇥ Đăng xuất khỏi hệ thống
              </button>
            </div>
          </div>
        </header>
        <main class="content" id="app"></main>
      </div>
    </div>
    <div id="modalRoot"></div>
    <div id="toastRoot"></div>
    <script src="/static/js/utils.js" defer></script>
    <script src="/static/js/state.js" defer></script>
    <script src="/static/js/dashboard.js" defer></script>
    <script src="/static/js/materials.js" defer></script>
    <script src="/static/js/count.js" defer></script>
    <script src="/static/js/docs.js" defer></script>
    <script src="/static/js/orders.js" defer></script>
    <script src="/static/js/contacts.js" defer></script>
    <script src="/static/js/settings.js" defer></script>
    <script src="/static/js/boot.js" defer></script>
  </body>
</html>
