# Production stack: app + Caddy (HTTPS). SQLite lives in $SCM_DATA_DIR on the
# host (an EBS-backed directory on EC2), never inside the container.
# Configuration: /srv/hoang-nhat/.env next to this file (see .env.example and
# docs/DEPLOY.md). Never run `docker compose down -v` casually: it deletes the
# Caddy certificate volumes (the database itself is a host directory).
services:
  app:
    build: .
    # EC2 + ECR: SCM_IMAGE=<account>.dkr.ecr.<region>.amazonaws.com/<repo>, SCM_IMAGE_TAG=<git commit>
    image: ${SCM_IMAGE:-hoang-nhat-scm}:${SCM_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    env_file:
      - path: ${SCM_APP_ENV:-./app.env}
        required: false
    environment:
      NODE_ENV: production
      SCM_DB_PATH: /data/hoang-nhat.sqlite3
      TRUST_PROXY: "1"
    volumes:
      - ${SCM_DATA_DIR:-./data}:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose:
      - "4173"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # Production: SCM_DOMAIN=kho.example.com. Unset = localhost (local test, self-signed cert).
      SCM_DOMAIN: ${SCM_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  caddy_data:
  caddy_config:
